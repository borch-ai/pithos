name: Human Approval Gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-human-approval:
    name: Require Human Approval Label
    runs-on: ubuntu-latest
    steps:
      - name: Verify approved-by-human label presence
        if: "!contains(github.event.pull_request.labels.*.name, 'approved-by-human')"
        run: |
          echo "❌ Missing required 'approved-by-human' label."
          echo "Please review the PR and apply the 'approved-by-human' label on GitHub to allow merging."
          exit 1
      - name: Approval verified
        if: "contains(github.event.pull_request.labels.*.name, 'approved-by-human')"
        run: |
          echo "✅ 'approved-by-human' label found. Human approval verified."
