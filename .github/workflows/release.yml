name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Powerword
        uses: actions/checkout@v4
        with:
          repository: borch-ai/powerword
          path: powerword
          token: ${{ steps.app-token.outputs.token }}

      - name: Create Powerword Sibling Symlink
        run: ln -s "$GITHUB_WORKSPACE/powerword" "$GITHUB_WORKSPACE/../powerword"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            powerword/go.sum

      - name: Run Linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Check Dependency Tidy Hygiene
        run: |
          make tidy
          git diff --exit-code go.mod go.sum

      - name: Run Vulnerability Scan
        run: make vuln

      - name: Run Tests & Check Coverage
        run: make check-coverage

      - name: Run Semantic Release
        uses: go-semantic-release/action@v1
        id: semrel
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Pithos Binaries
        if: steps.semrel.outputs.version != ''
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          mkdir -p dist
          VERSION_NUM="${VERSION#v}"
          VERSION_TAG="v${VERSION_NUM}"
          echo "Building version ${VERSION_TAG}..."
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X github.com/borch-ai/pithos/internal/config.Version=${VERSION_TAG}" -o dist/pithos-darwin-amd64 ./cmd/pithos
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X github.com/borch-ai/pithos/internal/config.Version=${VERSION_TAG}" -o dist/pithos-darwin-arm64 ./cmd/pithos
          GOOS=linux GOARCH=amd64 go build -ldflags "-X github.com/borch-ai/pithos/internal/config.Version=${VERSION_TAG}" -o dist/pithos-linux-amd64 ./cmd/pithos
          GOOS=linux GOARCH=arm64 go build -ldflags "-X github.com/borch-ai/pithos/internal/config.Version=${VERSION_TAG}" -o dist/pithos-linux-arm64 ./cmd/pithos
          GOOS=windows GOARCH=amd64 go build -ldflags "-X github.com/borch-ai/pithos/internal/config.Version=${VERSION_TAG}" -o dist/pithos-windows-amd64.exe ./cmd/pithos


      - name: Upload Binaries to GitHub Release
        if: steps.semrel.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          VERSION_NUM="${VERSION#v}"
          VERSION_TAG="v${VERSION_NUM}"
          gh release upload "$VERSION_TAG" dist/* --clobber
