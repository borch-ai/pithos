name: Go CI

on:
  pull_request:
    branches: [ main ]


permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pithos
        uses: actions/checkout@v6
        with:
          path: pithos

      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token-lint
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Powerword
        uses: actions/checkout@v6
        with:
          repository: borch-ai/powerword
          path: powerword
          token: ${{ steps.app-token-lint.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: pithos/go.mod
          cache: true
          cache-dependency-path: |
            pithos/go.sum
            powerword/go.sum

      - name: Run Linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: pithos

  security-and-test:
    name: Security & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pithos
    steps:
      - name: Checkout Pithos
        uses: actions/checkout@v6
        with:
          path: pithos

      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@v1
        id: app-token-test
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Powerword
        uses: actions/checkout@v6
        with:
          repository: borch-ai/powerword
          path: powerword
          token: ${{ steps.app-token-test.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: pithos/go.mod
          cache: true
          cache-dependency-path: |
            pithos/go.sum
            powerword/go.sum

      - name: Check Dependency Tidy Hygiene
        run: |
          make tidy
          git diff --exit-code go.mod go.sum

      - name: Run Vulnerability Scan
        run: make vuln

      - name: Run Tests & Check Coverage
        run: make check-coverage

      - name: Compile Binaries
        run: make build

