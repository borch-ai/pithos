name: Link Task Issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  link:
    uses: borch-ai/.github/.github/workflows/link-task-issue.yml@main
    with:
      pr-number: ${{ github.event.pull_request.number }}
      base-ref: ${{ github.event.pull_request.base.ref }}
    secrets: inherit
