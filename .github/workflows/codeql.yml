name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 20 * * 1' # 20:30 on Mondays

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-go:
    name: Analyze (Go)
    uses: borch-ai/.github/.github/workflows/codeql-with-sibling.yml@v0.2.2
    with:
      sibling-repo: borch-ai/powerword
      sibling-path: powerword
      repo-path: pithos
    secrets: inherit
