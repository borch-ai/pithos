version: "2"
run:
  issues-exit-code: 1
  tests: true
  go: "1.26"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
    - gosec
    - bodyclose
    - noctx
    - gocritic
    - nestif
    - funlen
    - gocognit
  settings:
    errcheck:
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - os.RemoveAll
        - os.Remove
        - (io.Writer).Write
        - (*encoding/json.Encoder).Encode
        - io.ReadAll
        - os.WriteFile
        - os.Setenv
        - os.Unsetenv
        - (*os.File).Close
        - encoding/json.Marshal
        - encoding/json.Unmarshal
        - (net/http.ResponseWriter).Write
        - (*github.com/borch-ai/pithos/internal/mcp.PluginClient).Stop
        - (*github.com/modelcontextprotocol/go-sdk/mcp.ServerSession).Close
        - (*github.com/modelcontextprotocol/go-sdk/mcp.ClientSession).Close
    nestif:
      min-complexity: 4
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 20
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
