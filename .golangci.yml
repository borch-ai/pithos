version: "2"
run:
  issues-exit-code: 1
  tests: true
  go: "1.26"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
    - gosec
    - bodyclose
    - noctx
    - gocritic
    - nestif
    - funlen
    - gocognit
  settings:
    errcheck:
      check-blank: true
      exclude-functions:
        - (io.Closer).Close # Candidate for eventual enforcement: closing files/responses can fail on flushing; checking ensures data integrity.
        - os.RemoveAll
        - os.Remove
        - (io.Writer).Write
        - (*encoding/json.Encoder).Encode
        - io.ReadAll
        - os.WriteFile # Candidate for eventual enforcement: file writes can fail due to disk space or permissions.
        - os.Setenv # Candidate for eventual enforcement: failing to set environment variables can break downstream configs.
        - os.Unsetenv
        - (*os.File).Close # Candidate for eventual enforcement: same as (io.Closer).Close; flushing to disk should be verified.
        - encoding/json.Marshal # Candidate for eventual enforcement: marshalling errors can output malformed payloads.
        - encoding/json.Unmarshal # Candidate for eventual enforcement: unmarshalling errors must be verified to prevent invalid/zeroed structures.
        - (net/http.ResponseWriter).Write
        - (*github.com/borch-ai/pithos/internal/mcp.PluginClient).Stop # Candidate for eventual enforcement: checking helps debug client cleanup leaks.
        - (*github.com/modelcontextprotocol/go-sdk/mcp.ServerSession).Close
        - (*github.com/modelcontextprotocol/go-sdk/mcp.ClientSession).Close
    nestif:
      min-complexity: 4
    funlen:
      lines: 100
      statements: 50
    gocognit:
      min-complexity: 20
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
